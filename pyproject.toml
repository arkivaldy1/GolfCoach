[project]
name = "golfcoach"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arkivaldy1", email = "arki.valdy1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.20",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
golfcoach = "golfcoach:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
